name: core_riverpod
description: "A new Flutter package project."
version: 1.0.7
homepage:

environment:
  sdk: ^3.10.7
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.2
  hooks_riverpod: any
  flutter_hooks: any
  riverpod_annotation: any
  freezed_annotation: any
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  custom_refresh_indicator: ^4.0.1
  device_info_plus: ^12.4.0
  system_info_plus: ^0.0.6
  connectivity_plus: ^6.1.1
  go_router: ^18.0.0
  glob: ^2.2.0
  build: ^4.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  freezed: any
  build_runner: ^2.16.0
  riverpod_generator: any
  flutter_lints: ^6.0.0

